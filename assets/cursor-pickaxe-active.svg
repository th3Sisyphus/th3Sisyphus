<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <g id="pickaxe" transform="rotate(-20 24 24)">
    <!-- Outline: Pickaxe Blade Tip & Arch -->
    <rect x="2" y="2" width="4" height="2" fill="#1C1917"/>
    <rect x="2" y="4" width="2" height="4" fill="#1C1917"/>
    <rect x="4" y="6" width="2" height="2" fill="#1C1917"/>
    <rect x="6" y="6" width="4" height="2" fill="#1C1917"/>
    
    <!-- Top outline of blade -->
    <rect x="6" y="2" width="6" height="2" fill="#1C1917"/>
    <rect x="12" y="2" width="4" height="2" fill="#1C1917"/>
    <rect x="16" y="2" width="4" height="2" fill="#1C1917"/>
    <rect x="20" y="4" width="2" height="4" fill="#1C1917"/>
    <rect x="18" y="6" width="2" height="2" fill="#1C1917"/>
    <rect x="14" y="6" width="4" height="2" fill="#1C1917"/>

    <!-- Gold Blade Fill (Highlight & Amber Shadow) -->
    <!-- Primary Striking Tip (at 4,4) -->
    <rect x="4" y="2" width="2" height="2" fill="#FEF08A"/>
    <rect x="2" y="4" width="2" height="2" fill="#FEF08A"/>
    <rect x="4" y="4" width="2" height="2" fill="#FBBF24"/>
    
    <!-- Left Blade Body -->
    <rect x="6" y="4" width="4" height="2" fill="#FBBF24"/>
    <rect x="6" y="5" width="2" height="1" fill="#FEF08A"/>
    <rect x="8" y="5" width="2" height="1" fill="#D97706"/>

    <!-- Central Socket / Collar -->
    <rect x="10" y="4" width="4" height="4" fill="#F59E0B"/>
    <rect x="10" y="4" width="2" height="2" fill="#FEF08A"/>
    <rect x="12" y="6" width="2" height="2" fill="#B45309"/>
    <rect x="10" y="8" width="4" height="2" fill="#1C1917"/>

    <!-- Right Blade Wing -->
    <rect x="14" y="4" width="4" height="2" fill="#FBBF24"/>
    <rect x="18" y="4" width="2" height="2" fill="#D97706"/>
    <rect x="16" y="5" width="2" height="1" fill="#B45309"/>

    <!-- Wooden Handle (Diagonal 45 deg) with Outline -->
    <!-- Outlines -->
    <rect x="10" y="10" width="4" height="4" fill="#1C1917"/>
    <rect x="12" y="12" width="4" height="4" fill="#1C1917"/>
    <rect x="14" y="14" width="4" height="4" fill="#1C1917"/>
    <rect x="16" y="16" width="4" height="4" fill="#1C1917"/>
    <rect x="18" y="18" width="4" height="4" fill="#1C1917"/>
    <rect x="20" y="20" width="4" height="4" fill="#1C1917"/>
    <rect x="22" y="22" width="4" height="4" fill="#1C1917"/>
    <rect x="24" y="24" width="4" height="4" fill="#1C1917"/>
    <rect x="26" y="24" width="2" height="4" fill="#1C1917"/>

    <!-- Wood Infill (Graduated tones) -->
    <rect x="11" y="11" width="2" height="2" fill="#FDE68A"/>
    <rect x="13" y="13" width="2" height="2" fill="#D97706"/>
    <rect x="15" y="15" width="2" height="2" fill="#B45309"/>
    <rect x="17" y="17" width="2" height="2" fill="#D97706"/>
    <rect x="19" y="19" width="2" height="2" fill="#B45309"/>
    <rect x="21" y="21" width="2" height="2" fill="#713F12"/>
    <rect x="23" y="23" width="2" height="2" fill="#451A03"/>
    <rect x="25" y="25" width="2" height="2" fill="#3B271A"/>
  </g>
</svg>